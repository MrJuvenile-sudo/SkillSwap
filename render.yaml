# Render Blueprint Specification for SkillSwapX
# Reference: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------
  # SkillSwapX Web & REST API Service
  # ----------------------------------------------------
  - type: web
    name: skillswapx
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && node init-db.js
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
